version = 1

[boot]
timeout = -1
fallback_timeout = 3600
default = "xnu"
rotate = 0
connect_all = true

[ui]
title = "OnePlus 9R - prelinked XNU diagnostics"

[kits]
autoload = false

[[entry]]
id = "xnu"
title = "Boot XNU root storage"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v keepsyms=1 kt_fixed_zones=120 lemonades-pmgr=2 sheng-data-persist=2 sheng-log-reserve=1024 lemonades-user-log=1 sheng-smp=1 armcpu-self-ipi=1 armcpu-spi-ipi=0 boot-progress=2 boot-diag-resume=0 boot-diag-overlay=1 sheng-disable-watchdogd=1 sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd offline-key-events=1 sheng-aks=1 boot-ui-focus=chronod boot-ui-focus2=SpringBoard boot-ui-focus3=backboardd boot-ui-focus4=runningboardd native-ufs-root=1 offline-apfs-load=1 -apfs_shared_datavolume offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-unit-scale=2 offline-legacy-pm=1 offline-legacy-validate=1 offline-legacy-transfer=1 offline-legacy-cpu-present=1 offline-legacy-phase=4 offline-mobile-graphics-load=1 lemonades-fts=1 offline-hid-input=1 offline-hid-home=1 sheng-touch-hid=1 lemonades-fts-gpi=1 lemonades-build-tag=lemonades-80"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
