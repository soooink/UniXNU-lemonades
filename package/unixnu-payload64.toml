version = 1

[boot]
timeout = 5
fallback_timeout = 3600
default = "payload64-check"
rotate = 0
connect_all = true

[ui]
title = "OnePlus 9R - 64 MiB payload test"

[kits]
autoload = false

[[entry]]
id = "payload64-check"
title = "Verify 64 MiB payload"
type = "efi"
path = "Payloads/LemonadesPayload64Check.efi"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
